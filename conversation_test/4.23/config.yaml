debug:
  emotion_rhythm_templates: true
emotion:
  base:
    #["happy","angry","sad","afraid","disgusted","melancholic","surprised","calm"]
    压迫性: [0.02,0.58,0.02,0.22,0.28,0.05,0.16,0.05]
    不耐烦: [0.04,0.55,0.02,0.1,0.65,0.05,0.12,-0.25]
    恐慌: [0.01,0.55,0.06,0.85,0.12,0.06,0.55,-0.15]
    愤怒: [0.01,0.65,0.2,0.15,0.5,0.08,0.15,-0.3]
    兴奋: [0.7,0.05,0.01,0.08,0,0.02,0.3,0.18]
    正常: [0.08,0.03,0.03,0.01,0.01,0.03,0.01,0.35]
    犹豫: [0.02,0.02,0.50,0.55,0.02,0.45,0.5,0.02]
  alpha:
    压迫性: 0.55
    不耐烦: 0.55
    犹豫: 0.6
    正常: 0.32
    兴奋: 0.58
    愤怒: 0.52
    恐慌: 0.6
  semantic:
    不耐烦:
      desc: 急躁催促
      prompt: 说话者明显不耐烦，带轻微咂舌和反问，句子短而直接，语速偏快但语气更蛮横、带质问（如“啧，能不能行？”“行了别绕”），避免压迫式命令口吻。
    压迫性:
      desc: 稳定施压
      prompt: 语气低沉而强势，节奏稳定、持续施压，句尾收得更硬更短，重音落在“必须/立刻/配合”等指令词上，语气压低，少上扬。
    犹豫:
      desc: 真实犹豫
      prompt: 用一种极度迟疑、边想边说的语气。语速要慢，句子中间有明显的气口。重点是尾音要有一种没说完的拖拽感，像是在顾虑对方的反应。
    恐慌:
      desc: 紧张失控边缘
      prompt: 声音紧张，呼吸略急，话语不够连贯但仍可表达，句子更碎、短停顿更多，语尾偶尔上扬。
    愤怒:
      desc: 压抑的愤怒
      prompt: 语气明显强硬，情绪愤怒但被压制，没有歇斯底里，语速偏快但不抢话，句尾更重、更短促，情绪集中在关键指责词上。
    兴奋:
      desc: 情绪上扬
      prompt: 语气略有上扬，说话节奏加快，情绪积极但不过度，语气更明亮，短句更利落。
    正常:
      desc: 中性自然
      prompt: 保持自然、平稳的说话语气，节奏均匀，情绪起伏不明显。

  rhythm_templates:
    正常:
      desc: 中性自然
      rules: []
    不耐烦:
      desc: 语速偏快、句子更短更硬、推进对话，不给太多解释空间
      rules:
        - desc: 轻微咂舌起句，体现蛮横质问
          pattern: ^(?!啧)
          replace: 啧，
          count: 1
          prob: 0.45
        - desc: 去掉多余拖尾，显得更急
          pattern: ……{1,}
          replace: …
          count: 2
        - pattern: 。{2,}
          replace: 。
          count: 2
        - desc: 更像质问而非命令
          pattern: 。$
          replace: ？
          count: 1
          prob: 0.65
        - pattern: ，{2,}
          replace: ，
          count: 2
        - pattern: ^(哎呀)
          replace: \1！
          count: 1
    压迫性:
      desc: 指令强势、持续施压
      rules:
        - desc: 语气更硬，减少问号
          pattern: ？$
          replace: 。
          count: 1
        - desc: 去掉感叹号前的停顿，使其语气更生硬
          pattern: ([！!])
          replace: ！
          prob: 1.0
        - desc: 在指令性动词后紧跟内容，不留空隙
          pattern: (请务必|立刻|马上|配合|必须)([，, ]?)
          replace: \1
          prob: 0.9
    犹豫:
      desc: 更明显的思考与吞吐，带少量自我修正和尾音拖住
      rules:
        - desc: 首句不是问号结尾才补“嗯……”
          pattern: ^(?![^。！？?？]*[？?])(?!\s*(?:哦|好吧|嗯|啊|呃))
          replace: 嗯……
          count: 1
          prob: 0.55
        - pattern: (但是|不过|其实|可能|这个)
          replace: \1…
          count: 2
        - desc: 增加轻微停顿，不全靠省略号
          pattern: (啊|呃|嗯)(?![？?])([，。])?
          replace: \1，
          count: 1
        - pattern: (我觉得|我想|应该|大概)([，。])
          replace: \1……\2
          count: 2
        - pattern: 。$
          replace: ……
          count: 1
          prob: 0.75
        - desc: 已有“我……我”/“我...我”时只做归一，不重复插入
          pattern: 我(?:…|\.){1,}我
          replace: 我……我
          count: 1
        - desc: 轻微自我修正“我……我”
          pattern: ^(?!.*我(?:…|\.{3,})+我)\s*我
          replace: 我……我
          count: 1
          prob: 0.75
        - desc: 句中出现“我”，补一次轻微改口
          pattern: ([。！？]|^)\s*我
          replace: \1我……我
          count: 1
          prob: 0.55
        - desc: 自我修正后加短暂停顿，模拟吞咽感
          pattern: 我……我(?![，。])
          replace: 我……我……
          count: 1
          prob: 0.6
    愤怒:
      desc: 压着的愤怒，而非失控
      rules:
        - pattern: 。$
          replace: ！
          count: 1
        - desc: 重音更硬，短促
          pattern: ，
          replace: ，
          count: 2
    恐慌:
      desc: 紧张但不破碎
      rules:
        - pattern: 我
          replace: 我……
          count: 1
        - desc: 句子切碎些
          pattern: ([，。])
          replace: …\1
          count: 1
        - desc: 结尾不安
          pattern: 。$
          replace: ……。
          count: 1
    兴奋:
      desc: 情绪上扬但不过度
      rules:
        - pattern: 。
          replace: ！
          count: 1
        - pattern: ？
          replace: ！
          count: 1
        - pattern: 是这样的，
          replace: 是这样的！
          count: 1
        - pattern: 真的假的啊
          replace: 真的假的啊！
          desc: 加强兴奋语气
speech_rate:
  speed_factor:
    语速加快: 1.02
    语速放慢: 0.97
    不自然停顿: 1.0
    正常: 1.0
text_process:
  punctuation:
    question:
      pattern: ？$
      replace: ？
      desc: 保留问号，不自动加语气词
    exclamation:
      pattern: ！
      replace: ！
      desc: 保留感叹号，不自动加语气词
  job_id:
    pattern: (工号|编号|账号)[：:]?\s*(\d+)
    desc: 工号逐字读
speaker_map:
  Agent: /home/shentong/index-tts-main/examples_fixed/voice_07.wav
  User_male: /home/shentong/index-tts-main/examples_fixed/voice_00.wav
  User_female: /home/shentong/index-tts-main/examples_fixed/voice_11.wav
speaker_pool:
  enabled: true
  base_dir: /home/shentong/index-tts-main/axis_pack/音频路径
  female_pattern: "^A([1-9]|1[0-9]|2[0-2])\\.(wav|mp3|flac|m4a)$"
  male_pattern: "^B([1-9]|1[0-9]|2[0-1])\\.(wav|mp3|flac|m4a)$"
  log_audio_format: true
postprocess_audio:
  normalize_headroom_db: 6.0
  target_peak_dbfs: -1.0
  extra_gain_db: 0.0
